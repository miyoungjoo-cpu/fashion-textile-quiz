<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>패션소재연구 · 천연섬유 형성평가</title>
<style>
:root{
--ink:#1F3864;
--ink-soft:#44546A;
--paper:#FFFFFF;
--panel:#F5F7FA;
--line:#E3E8F0;
--thread:#C9902E;
--good:#1E7B4D;
--good-bg:#EAF6EE;
--bad:#B4322A;
--bad-bg:#FDECEA;
--radius:16px;
}

*{ box-sizing:border-box; }

html,body{
margin:0; padding:0;
background:var(--paper);
color:var(--ink);
font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
-webkit-font-smoothing:antialiased;
}

.display{
font-family:"Noto Serif KR","Nanum Myeongjo",serif;
}

.wrap{
max-width:640px;
margin:0 auto;
padding:0 20px 64px;
}

/* ---------- Header ---------- */
header{
padding:28px 0 20px;
}
.eyebrow{
font-size:12px;
letter-spacing:.14em;
color:var(--thread);
font-weight:700;
text-transform:uppercase;
margin:0 0 6px;
}
h1{
font-size:26px;
line-height:1.35;
margin:0 0 6px;
font-weight:700;
color:var(--ink);
}
.subtitle{
font-size:14px;
color:var(--ink-soft);
margin:0;
}

/* ---------- Stitched progress bar (signature element) ---------- */
.progress-shell{
margin-top:22px;
}
.progress-meta{
display:flex;
justify-content:space-between;
align-items:baseline;
margin-bottom:8px;
}
.progress-meta .count{
font-size:13px;
font-weight:700;
color:var(--ink);
font-variant-numeric:tabular-nums;
}
.progress-meta .score{
font-size:12px;
color:var(--ink-soft);
}
.stitch-track{
position:relative;
height:14px;
display:flex;
align-items:center;
}
.stitch-track::before{
content:"";
position:absolute;
left:0; right:0; top:50%;
height:0;
border-top:2px dashed var(--line);
transform:translateY(-50%);
}
.stitch-fill{
position:absolute;
left:0; top:50%;
height:0;
border-top:2px dashed var(--thread);
transform:translateY(-50%);
width:0%;
transition:width .5s cubic-bezier(.4,0,.2,1);
}
.stitch-dot{
position:absolute;
top:50%;
width:10px; height:10px;
border-radius:50%;
background:var(--paper);
border:2px solid var(--line);
transform:translate(-50%,-50%);
transition:background .3s, border-color .3s;
}
.stitch-dot.done{ background:var(--thread); border-color:var(--thread); }
.stitch-dot.current{ border-color:var(--ink); }

/* ---------- Card ---------- */
main{ margin-top:30px; }

.card{
background:var(--panel);
border:1px solid var(--line);
border-radius:var(--radius);
padding:26px 22px;
}

.q-index{
font-size:12px;
font-weight:700;
letter-spacing:.08em;
color:var(--thread);
margin:0 0 10px;
text-transform:uppercase;
}

.q-text{
font-size:19px;
line-height:1.5;
font-weight:700;
color:var(--ink);
margin:0 0 20px;
}

.options{
display:flex;
flex-direction:column;
gap:10px;
}
.option{
display:flex;
align-items:center;
gap:12px;
text-align:left;
width:100%;
padding:14px 16px;
background:var(--paper);
border:1.5px solid var(--line);
border-radius:12px;
font-size:15px;
color:var(--ink);
cursor:pointer;
font-family:inherit;
transition:border-color .15s, background .15s, transform .1s;
}
.option:hover:not(:disabled){
border-color:var(--ink);
}
.option:active:not(:disabled){
transform:scale(0.99);
}
.option:disabled{
cursor:default;
}
.option .mark{
flex:0 0 auto;
width:26px; height:26px;
border-radius:50%;
border:1.5px solid var(--line);
display:flex; align-items:center; justify-content:center;
font-size:13px; font-weight:700;
color:var(--ink-soft);
}
.option .label{ flex:1; }

.option.correct{
background:var(--good-bg);
border-color:var(--good);
}
.option.correct .mark{
background:var(--good); border-color:var(--good); color:#fff;
}
.option.wrong{
background:var(--bad-bg);
border-color:var(--bad);
}
.option.wrong .mark{
background:var(--bad); border-color:var(--bad); color:#fff;
}
.option.dim{
opacity:.55;
}

.feedback{
margin-top:18px;
padding:16px 18px;
border-radius:12px;
font-size:14px;
line-height:1.6;
display:none;
}
.feedback.show{ display:block; animation:fadeIn .25s ease; }
.feedback.good{ background:var(--good-bg); color:#155c39; border:1px solid #bfe3cd; }
.feedback.bad{ background:var(--bad-bg); color:#8c2620; border:1px solid #f3c6c1; }
.feedback .tag{
display:inline-block;
font-weight:700;
margin-right:6px;
}
@keyframes fadeIn{
from{ opacity:0; transform:translateY(4px); }
to{ opacity:1; transform:translateY(0); }
}

.nav-row{
margin-top:22px;
display:flex;
justify-content:flex-end;
}
.next-btn{
display:none;
align-items:center;
gap:6px;
padding:12px 20px;
background:var(--ink);
color:#fff;
border:none;
border-radius:999px;
font-size:14px;
font-weight:700;
font-family:inherit;
cursor:pointer;
}
.next-btn.show{ display:inline-flex; }
.next-btn:active{ transform:scale(0.98); }

/* ---------- Result screen ---------- */
.result{
display:none;
text-align:center;
padding:40px 22px;
background:var(--panel);
border:1px solid var(--line);
border-radius:var(--radius);
}
.result.show{ display:block; }
.result .big-score{
font-family:"Noto Serif KR",serif;
font-size:56px;
font-weight:700;
color:var(--ink);
line-height:1;
margin:6px 0 4px;
}
.result .big-score span{
font-size:22px;
color:var(--ink-soft);
font-family:"Noto Sans KR",sans-serif;
font-weight:500;
}
.result .comment{
font-size:14px;
color:var(--ink-soft);
margin:10px 0 26px;
}
.result .retry-btn{
padding:12px 24px;
background:var(--ink);
color:#fff;
border:none;
border-radius:999px;
font-size:14px;
font-weight:700;
font-family:inherit;
cursor:pointer;
}
.result .retry-btn:active{ transform:scale(0.98); }

footer{
margin-top:36px;
text-align:center;
font-size:12px;
color:#9AA5B4;
}

@media (max-width:420px){
h1{ font-size:22px; }
.q-text{ font-size:17px; }
.card{ padding:20px 16px; }
.result .big-score{ font-size:46px; }
}
</style>
</head>
<body>

<div class="wrap">
<header>
<p class="eyebrow">패션소재연구</p>
<h1 class="display">천연섬유의 특성 — 형성평가</h1>
<p class="subtitle">문항을 선택하면 즉시 정답과 해설을 확인할 수 있습니다.</p>

<div class="progress-shell">
<div class="progress-meta">
<span class="count" id="progressCount">문항 1 / 5</span>
<span class="score" id="progressScore">맞은 개수 0</span>
</div>
<div class="stitch-track" id="stitchTrack">
<div class="stitch-fill" id="stitchFill"></div>
<!-- dots injected by JS -->
</div>
</div>
</header>
<main>
<div class="card" id="quizCard">
<p class="q-index" id="qIndexLabel">Q1</p>
<p class="q-text" id="qText"></p>
<div class="options" id="optionsWrap"></div>
<div class="feedback" id="feedback"></div>
<div class="nav-row">
<button class="next-btn" id="nextBtn">다음 문항 →</button>
</div>
</div>

<div class="result" id="resultCard">
<p class="eyebrow">RESULT</p>
<p class="big-score"><span id="resultScore">0</span> <span>/ 5</span></p>
<p class="comment" id="resultComment"></p>
<button class="retry-btn" id="retryBtn">다시 풀어보기</button>
</div>
</main>

<footer>패션소재연구 · 2주차 천연섬유의 특성 · 형성평가</footer>
</div>

<script>
const QUESTIONS = [
{
q: "다음 중 천연섬유가 아닌 것은?",
options: ["면", "마", "나일론", "견"],
answer: 2,
explain: "나일론은 화학적으로 합성한 인조섬유(합성섬유)이며, 면·마·견·모는 자연에서 얻는 천연섬유입니다."
},
{
q: "천연섬유 중 유일한 필라멘트 섬유로, 길이가 약 1km에 달하는 섬유는?",
options: ["면", "마", "견", "모"],
answer: 2,
explain: "견(silk)은 누에고치에서 얻는 천연섬유 중 유일하게 길고 연속된 필라멘트 형태의 섬유입니다."
},
{
q: "다음 중 셀룰로오스(식물성) 섬유로만 옳게 짝지어진 것은?",
options: ["면, 마", "견, 모", "면, 견", "마, 모"],
answer: 0,
explain: "면과 마는 식물에서 얻는 셀룰로오스 섬유이며, 견과 모는 동물에서 얻는 단백질 섬유입니다."
},
{
q: "마(Linen)의 특성으로 옳지 않은 것은?",
options: ["열전도율이 높아 여름철에 시원하다", "천연섬유 중 강도가 가장 크다", "구김이 잘 가지 않는다", "광택이 좋다"],
answer: 2,
explain: "마는 탄성회복률(리질리언스)이 낮아 구김이 잘 가고 잘 펴지지 않는 것이 대표적인 단점입니다."
},
{
q: "다림질을 할 때 가장 낮은 온도로 다려야 하는 섬유는?",
options: ["면", "마", "모", "나일론"],
answer: 3,
explain: "합성섬유인 나일론은 열에 매우 약해 천연섬유(모·면·마)보다 훨씬 낮은 온도에서 다림질해야 합니다."
}
];

let current = 0;
let score = 0;
let answered = [];
const elQIndex = document.getElementById('qIndexLabel');
const elQText = document.getElementById('qText');
const elOptionsWrap = document.getElementById('optionsWrap');
const elFeedback = document.getElementById('feedback');
const elNextBtn = document.getElementById('nextBtn');
const elProgressCount = document.getElementById('progressCount');
const elProgressScore = document.getElementById('progressScore');
const elStitchTrack = document.getElementById('stitchTrack');
const elStitchFill = document.getElementById('stitchFill');
const elQuizCard = document.getElementById('quizCard');
const elResultCard = document.getElementById('resultCard');
const elResultScore = document.getElementById('resultScore');
const elResultComment = document.getElementById('resultComment');
const elRetryBtn = document.getElementById('retryBtn');

function buildStitchDots(){
elStitchTrack.querySelectorAll('.stitch-dot').forEach(d => d.remove());
const total = QUESTIONS.length;
for(let i=0;i<total;i++){
const dot = document.createElement('div');
dot.className = 'stitch-dot';
dot.style.left = (i/(total-1))*100 + '%';
dot.dataset.idx = i;
elStitchTrack.appendChild(dot);
}
}

function updateProgress(){
const total = QUESTIONS.length;
elProgressCount.textContent = `문항 ${current+1} / ${total}`;
elProgressScore.textContent = `맞은 개수 ${score}`;
const fillPct = (current/(total-1))*100;
elStitchFill.style.width = fillPct + '%';
elStitchTrack.querySelectorAll('.stitch-dot').forEach(dot=>{
const idx = parseInt(dot.dataset.idx,10);
dot.classList.toggle('done', idx < current || (idx===current && answered[current]!==undefined));
dot.classList.toggle('current', idx === current);
});
}
function renderQuestion(){
const item = QUESTIONS[current];
elQIndex.textContent = `Q${current+1}`;
elQText.textContent = item.q;
elOptionsWrap.innerHTML = '';
elFeedback.className = 'feedback';
elFeedback.textContent = '';
elNextBtn.classList.remove('show');

const marks = ['①','②','③','④'];
item.options.forEach((opt, i)=>{
const btn = document.createElement('button');
btn.className = 'option';
btn.innerHTML = `<span class="mark">${marks[i]}</span><span class="label">${opt}</span>`;
btn.addEventListener('click', ()=> selectAnswer(i));
elOptionsWrap.appendChild(btn);
});

if(answered[current] !== undefined){
lockQuestion(answered[current], false);
}

updateProgress();
}

function selectAnswer(i){
if(answered[current] !== undefined) return;
answered[current] = i;
const item = QUESTIONS[current];
if(i === item.answer) score++;
lockQuestion(i, true);
updateProgress();
}

function lockQuestion(selectedIdx, animate){
const item = QUESTIONS[current];
const opts = elOptionsWrap.querySelectorAll('.option');
opts.forEach((btn, i)=>{
btn.disabled = true;
if(i === item.answer){
btn.classList.add('correct');
} else if(i === selectedIdx){
btn.classList.add('wrong');
} else {
btn.classList.add('dim');
}
});

const isCorrect = selectedIdx === item.answer;
elFeedback.className = 'feedback show ' + (isCorrect ? 'good' : 'bad');
elFeedback.innerHTML = `<span class="tag">${isCorrect ? '정답입니다.' : '오답입니다.'}</span> ${item.explain}`;

elNextBtn.classList.add('show');
elNextBtn.textContent = current === QUESTIONS.length - 1 ? '결과 보기 →' : '다음 문항 →';
}
elNextBtn.addEventListener('click', ()=>{
if(current < QUESTIONS.length - 1){
current++;
renderQuestion();
} else {
showResult();
}
});

function showResult(){
elQuizCard.style.display = 'none';
elResultCard.classList.add('show');
elResultScore.textContent = score;
let comment;
if(score === QUESTIONS.length) comment = '완벽합니다! 천연섬유의 특성을 정확히 이해하고 있어요.';
else if(score >= 3) comment = '잘했어요! 헷갈렸던 문항의 해설을 다시 한 번 확인해보세요.';
else comment = '괜찮아요. 강의자료의 면·마·견·모 특성 표를 다시 살펴본 뒤 재도전해보세요.';
elResultComment.textContent = comment;
elProgressCount.textContent = `문항 ${QUESTIONS.length} / ${QUESTIONS.length}`;
elProgressScore.textContent = `맞은 개수 ${score}`;
elStitchFill.style.width = '100%';
elStitchTrack.querySelectorAll('.stitch-dot').forEach(dot=> dot.classList.add('done'));
}

elRetryBtn.addEventListener('click', ()=>{
current = 0; score = 0; answered = [];
elQuizCard.style.display = 'block';
elResultCard.classList.remove('show');
renderQuestion();
});

buildStitchDots();
renderQuestion();
</script>

</body>
</html>
